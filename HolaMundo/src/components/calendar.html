<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario</title>
    <style>
        .calendar {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 0 auto;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 10px;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .calendar-title {
            font-size: 1.2em;
            font-weight: bold;
        }

        .calendar-nav {
            display: flex;
            gap: 5px;
        }

        .calendar-nav button {
            padding: 5px 10px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 3px;
            cursor: pointer;
        }

        .calendar-nav button:hover {
            background-color: #e0e0e0;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }

        .calendar-day {
            text-align: center;
            padding: 5px;
            border: 1px solid #eee;
            border-radius: 3px;
        }

        .calendar-day-header {
            font-weight: bold;
            background-color: #f0f0f0;
        }

        .calendar-day-empty {
            background-color: #f9f9f9;
        }

        .calendar-day-today {
            background-color: #e0f7fa;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="calendar">
        <div class="calendar-header">
            <div class="calendar-title">Octubre 2023</div>
            <div class="calendar-nav">
                <button id="prev-month">«</button>
                <button id="next-month">»</button>
            </div>
        </div>
        <div class="calendar-grid">
            <div class="calendar-day calendar-day-header">Dom</div>
            <div class="calendar-day calendar-day-header">Lun</div>
            <div class="calendar-day calendar-day-header">Mar</div>
            <div class="calendar-day calendar-day-header">Mié</div>
            <div class="calendar-day calendar-day-header">Jue</div>
            <div class="calendar-day calendar-day-header">Vie</div>
            <div class="calendar-day calendar-day-header">Sáb</div>
            <!-- Días del calendario se generarán dinámicamente con JavaScript -->
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const calendarGrid = document.querySelector('.calendar-grid');
            const calendarTitle = document.querySelector('.calendar-title');
            const prevMonthBtn = document.getElementById('prev-month');
            const nextMonthBtn = document.getElementById('next-month');

            let currentDate = new Date();

            function renderCalendar() {
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();

                // Establecer el título del calendario
                const monthNames = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
                calendarTitle.textContent = `${monthNames[month]} ${year}`;

                // Obtener el primer día del mes y el número de días en el mes
                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();

                // Limpiar el calendario
                const days = document.querySelectorAll('.calendar-day:not(.calendar-day-header)');
                days.forEach(day => day.remove());

                // Añadir días vacíos al principio del mes
                for (let i = 0; i < firstDay; i++) {
                    const emptyDay = document.createElement('div');
                    emptyDay.className = 'calendar-day calendar-day-empty';
                    calendarGrid.appendChild(emptyDay);
                }

                // Añadir días del mes
                const today = new Date();
                for (let i = 1; i <= daysInMonth; i++) {
                    const day = document.createElement('div');
                    day.className = 'calendar-day';
                    day.textContent = i;

                    // Marcar el día actual
                    if (i === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
                        day.classList.add('calendar-day-today');
                    }

                    calendarGrid.appendChild(day);
                }
            }

            // Navegación entre meses
            prevMonthBtn.addEventListener('click', function() {
                currentDate.setMonth(currentDate.getMonth() - 1);
                renderCalendar();
            });

            nextMonthBtn.addEventListener('click', function() {
                currentDate.setMonth(currentDate.getMonth() + 1);
                renderCalendar();
            });

            // Renderizar el calendario inicial
            renderCalendar();
        });
    </script>
</body>
</html>
