<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campo de Entrada</title>
    <style>
        .input-container {
            margin: 10px 0;
        }
        .input-label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .input-field {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .input-field:focus {
            border-color: #007bff;
            outline: none;
        }
    </style>
</head>
<body>
    <div class="input-container">
        <label for="input-field" class="input-label">Nombre:</label>
        <input type="text" id="input-field" class="input-field" placeholder="Ingrese su nombre">
    </div>
</body>
</html>
