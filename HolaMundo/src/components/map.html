<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de la Página</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .map-container {
            width: 100%;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
        .map-title {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .map {
            width: 100%;
            height: 400px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="map-container">
        <h1 class="map-title">Mapa de la Página</h1>
        <div id="map" class="map"></div>
    </div>

    <script>
        // Inicializar el mapa cuando el DOM esté cargado
        document.addEventListener('DOMContentLoaded', function() {
            // Coordenadas de ejemplo (Madrid, España)
            const center = { lat: 40.4168, lng: -3.7038 };

            // Crear el mapa
            const map = new google.maps.Map(document.getElementById('map'), {
                zoom: 12,
                center: center
            });

            // Añadir un marcador en el centro del mapa
            new google.maps.Marker({
                position: center,
                map: map,
                title: 'Ubicación de ejemplo'
            });
        });
    </script>

    <!-- Cargar la API de Google Maps -->
    <script async defer
        src="https://maps.googleapis.com/maps/api/js?key=TU_API_KEY&callback=initMap">
    </script>
</body>
</html>
